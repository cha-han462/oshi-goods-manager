
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>推し活グッズ収支管理</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fff5f9;
      color: #444;
      margin: 0;
      padding: 24px;
    }

    h1 {
      color: #db6697;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 2px 8px #00000012;
    }

    button {
      background: #db6697;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>推し活グッズ収支管理</h1>
  <p>お気に入りのグッズと思い出を記録しよう！</p>

  <div class="card">
    <h2>マイコレクション</h2>
    <p>ここにグッズの写真や情報が並ぶ予定です。</p>
    <button onclick="showMessage()">グッズを登録する</button>
  </div>

  <script>
    function showMessage() {
      alert("これからグッズ登録機能を作るよ！");
    }
  </script>
</body>
</html>
